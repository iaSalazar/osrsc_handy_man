[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "osrsc-telemetry-emulator"
version = "0.1.0"
description = "Synthetic Human Telemetry Emulator — realistic input data for behavioral anomaly detection"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.9",
    "scipy>=1.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "Pillow>=10.0",
    "mss>=9.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "matplotlib>=3.8"]
ocr = ["pytesseract>=0.3"]

[project.scripts]
telem-emu = "tools.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
